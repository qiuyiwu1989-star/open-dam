name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python 语法检查
        run: python3 -m compileall -q app worker integrations
      - name: Reliability regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Public export checks
        run: python3 scripts/check_public_export.py
      - name: compose 配置校验
        run: docker compose -f docker-compose.yml config -q
        env:
          PG_PASSWORD: ci
