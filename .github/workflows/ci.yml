name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python 语法检查
        run: python3 -m py_compile app/main.py worker/worker.py
      - name: compose 配置校验
        run: docker compose -f docker-compose.yml config -q
        env:
          PG_PASSWORD: ci
