services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: opendam
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opendam"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8091
    environment:
      DATABASE_URL: postgres://postgres:${PG_PASSWORD}@db:5432/opendam
      DATA_DIR: /data
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      AI_ENABLED: ${AI_ENABLED:-true}
      CLIP_MODEL: ${CLIP_MODEL:-ViT-B-32}
      CLIP_PRETRAINED: ${CLIP_PRETRAINED:-laion2b_s34b_b79k}
    volumes:
      - uploads:/data
      - models:/root/.cache
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python worker/worker.py
    environment:
      DATABASE_URL: postgres://postgres:${PG_PASSWORD}@db:5432/opendam
      DATA_DIR: /data
      AI_ENABLED: ${AI_ENABLED:-true}
      CLIP_MODEL: ${CLIP_MODEL:-ViT-B-32}
      CLIP_PRETRAINED: ${CLIP_PRETRAINED:-laion2b_s34b_b79k}
      # open_clip 权重缓存到 models 卷(首次下载,之后离线可用)
      HF_HOME: /root/.cache/huggingface
    volumes:
      - uploads:/data
      - models:/root/.cache
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - uploads:/srv/uploads:ro
    depends_on:
      - app

volumes:
  dbdata:
  uploads:
  models:
