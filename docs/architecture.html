<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>open-dam · 架构图</title>
<style>
  :root{
    --paper:#f4f1ea; --card:#fffdf8; --ink:#2b2620; --muted:#8a7f6d;
    --line:#ddd2ba; --accent:#b0673a; --accent-soft:#e9d9c6; --ok:#5d7a52;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",serif;
    display:flex; flex-direction:column; align-items:center;
    padding:28px 16px 36px;
  }
  header{text-align:center; margin-bottom:14px}
  header h1{font-size:26px; font-weight:600; letter-spacing:2px}
  header h1 em{color:var(--accent); font-style:normal}
  header p{
    margin-top:6px; font-size:12.5px; color:var(--muted); letter-spacing:1px;
    font-family:"JetBrains Mono","SF Mono",Menlo,monospace;
  }
  .frame{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 10px 40px rgba(90,70,40,.08);
    padding:18px 14px; max-width:1280px; width:100%;
  }
  svg{display:block; width:100%; height:auto}
  .mono{font-family:"JetBrains Mono","SF Mono",Menlo,monospace}
  .layer{font:600 13px "JetBrains Mono",Menlo,monospace; fill:var(--accent); letter-spacing:1px}
  .box-title{font:600 13.5px "Noto Serif SC",serif; fill:var(--ink)}
  .box-sub{font:11px "JetBrains Mono",Menlo,monospace; fill:var(--muted)}
  .tiny{font:10.5px "JetBrains Mono",Menlo,monospace; fill:var(--muted)}
  .step{font:600 12px "Noto Serif SC",serif; fill:var(--ink)}
  .note{font:11px "Noto Serif SC",serif; fill:var(--accent)}
  .band{font:600 11px "JetBrains Mono",Menlo,monospace; fill:var(--ok)}
  footer{
    margin-top:14px; font-size:11.5px; color:var(--muted); letter-spacing:1px;
    font-family:"JetBrains Mono",Menlo,monospace; text-align:center;
  }
</style>
</head>
<body>

<header>
  <h1>open-<em>dam</em> · AI 原生自托管图库 架构图</h1>
  <p>人工上传导入 · AI 全本地 · docker compose 一键 · 断网可用</p>
  </header>

<div class="frame">
<svg viewBox="0 0 1240 812" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b0673a"/>
    </marker>
    <style>
      .card{fill:#fbf8f1;stroke:#ddd2ba;stroke-width:1.2;rx:10}
      .cardA{fill:#f7ede1;stroke:#b0673a;stroke-width:1.2}
      .arrow{stroke:#b0673a;stroke-width:1.6;fill:none;marker-end:url(#arr)}
      .gone{stroke:#8a7f6d;stroke-width:1.1;stroke-dasharray:4 4}
    </style>
  </defs>

  <!-- ════ L1 导入层 ════ -->
  <text x="30" y="30" class="layer">① 人工导入（唯一数据源）</text>
  <g>
    <rect x="30" y="42" width="380" height="86" rx="10" class="card cardA"/>
    <text x="50" y="70" class="box-title">浏览器拖拽上传</text>
    <text x="50" y="90" class="box-sub">多文件 / 整个文件夹拖入 · 分片断点续传</text>
    <text x="50" y="108" class="box-sub">上传时可选目标集合 / 目录(人工归类)</text>

    <rect x="430" y="42" width="380" height="86" rx="10" class="card"/>
    <text x="450" y="70" class="box-title">zip 批量包导入</text>
    <text x="450" y="90" class="box-sub">历史素材打包一次倒入 · 服务端解压</text>
    <text x="450" y="108" class="box-sub">目录结构自动映射为集合</text>

    <rect x="830" y="42" width="380" height="86" rx="10" class="card"/>
    <text x="850" y="70" class="box-title">本地目录批量导入（Roadmap）</text>
    <text x="850" y="90" class="box-sub">挂载共享盘 / NAS 目录扫描入库</text>
    <text x="850" y="108" class="box-sub">挂载共享盘 / NAS 目录扫描入库</text>
  </g>

  <line x1="220" y1="128" x2="220" y2="158" class="arrow"/>
  <line x1="620" y1="128" x2="620" y2="158" class="arrow"/>
  <line x1="1020" y1="128" x2="1020" y2="158" class="arrow"/>
  <text x="620" y="150" text-anchor="middle" class="band">上传即入队 · 内容寻址秒传去重 · 全程离线 · 全程幂等</text>

  <!-- ════ L2 入库管线 ════ -->
  <text x="30" y="152" class="layer">② 入库管线（上传触发 · 后台 worker 异步）</text>
  <rect x="30" y="162" width="1180" height="96" rx="12" fill="none" stroke="#ddd2ba" stroke-dasharray="5 4"/>
  <g>
    <rect x="50" y="182" width="176" height="56" rx="8" class="card"/>
    <text x="138" y="206" text-anchor="middle" class="step">1 接收+秒判重</text>
    <text x="138" y="224" text-anchor="middle" class="tiny">sha256 已存在 → 秒回</text>

    <rect x="244" y="182" width="176" height="56" rx="8" class="card"/>
    <text x="332" y="206" text-anchor="middle" class="step">2 零样本分类</text>
    <text x="332" y="224" text-anchor="middle" class="tiny">CLIP 分类 + EXIF/文件名</text>

    <rect x="438" y="182" width="176" height="56" rx="8" class="card"/>
    <text x="526" y="206" text-anchor="middle" class="step">3 主色</text>
    <text x="526" y="224" text-anchor="middle" class="tiny">本地算 ave_rgb + 色相</text>

    <rect x="632" y="182" width="176" height="56" rx="8" class="card cardA"/>
    <text x="720" y="206" text-anchor="middle" class="step">4 CLIP 向量</text>
    <text x="720" y="224" text-anchor="middle" class="tiny">ViT-B/32 内置权重 · CPU 可跑</text>

    <rect x="826" y="182" width="176" height="56" rx="8" class="card"/>
    <text x="914" y="206" text-anchor="middle" class="step">5 打标 · 聚簇</text>
    <text x="914" y="224" text-anchor="middle" class="tiny">零样本标签 · pHash 近重复折叠</text>

    <rect x="1020" y="182" width="176" height="56" rx="8" class="card"/>
    <text x="1108" y="206" text-anchor="middle" class="step">6 质检入底座</text>
    <text x="1108" y="224" text-anchor="middle" class="tiny">测糊测废 · ON CONFLICT</text>

    <line x1="226" y1="210" x2="242" y2="210" class="arrow"/>
    <line x1="420" y1="210" x2="436" y2="210" class="arrow"/>
    <line x1="614" y1="210" x2="632" y2="210" class="arrow"/>
    <line x1="808" y1="210" x2="824" y2="210" class="arrow"/>
    <line x1="1002" y1="210" x2="1018" y2="210" class="arrow"/>
  </g>

  <line x1="620" y1="258" x2="620" y2="288" class="arrow"/>

  <!-- ════ L3 存储层 ════ -->
  <text x="30" y="284" class="layer">③ 存储（全部本地）</text>
  <g>
    <rect x="30" y="292" width="700" height="150" rx="10" class="card cardA"/>
    <text x="50" y="318" class="box-title">本地 Postgres（pgvector）</text>
    <rect x="50" y="330" width="320" height="44" rx="6" class="card"/>
    <text x="62" y="348" class="tiny">统一底座(检索层)</text>
    <text x="62" y="364" class="box-sub">dam_asset · dam_embedding HNSW</text>
    <rect x="390" y="330" width="320" height="44" rx="6" class="card"/>
    <text x="402" y="348" class="tiny">导入任务队列</text>
    <text x="402" y="364" class="box-sub">task 表 · 队列 / 去重报告</text>
    <rect x="50" y="384" width="660" height="44" rx="6" class="card"/>
    <text x="62" y="402" class="tiny">用户域(与线上版同一套)</text>
    <text x="62" y="418" class="box-sub">收藏 · 集合 · 智能文件夹 · 标签 · 投票 · 分享</text>

    <rect x="750" y="292" width="460" height="150" rx="10" class="card"/>
    <text x="770" y="318" class="box-title">本地对象存储（MinIO / 文件目录）</text>
    <text x="770" y="342" class="box-sub">内容寻址 uploads/&lt;sha256&gt;.ext</text>
    <text x="770" y="362" class="box-sub">sha256 即路径 → 天然去重 · 秒传</text>
    <text x="770" y="382" class="box-sub">原图 + 本地生成缩略图</text>
    <text x="770" y="410" class="note">一次存图,五种找法 ↓</text>
  </g>

  <line x1="620" y1="442" x2="620" y2="472" class="arrow"/>

  <!-- ════ L4 服务层 ════ -->
  <text x="30" y="466" class="layer">④ 服务</text>
  <g>
    <rect x="30" y="476" width="1180" height="86" rx="10" class="card cardA"/>
    <text x="50" y="502" class="box-title">app/main.py · FastAPI · :8091</text>
    <rect x="50" y="514" width="370" height="36" rx="6" class="card"/>
    <text x="66" y="537" class="box-sub">导入 /upload · 检索 /search/text · /similar</text>
    <rect x="436" y="514" width="370" height="36" rx="6" class="card"/>
    <text x="452" y="537" class="box-sub">检索 /search · /similar · /browse · /colors</text>
    <rect x="822" y="514" width="370" height="36" rx="6" class="card"/>
    <text x="838" y="537" class="box-sub">资产+用户 /detail · /zip · /collections</text>
  </g>

  <line x1="620" y1="562" x2="620" y2="592" class="arrow"/>

  <!-- ════ L5 接入层 ════ -->
  <text x="30" y="586" class="layer">⑤ 接入</text>
  <g>
    <rect x="30" y="596" width="1180" height="78" rx="10" class="card"/>
    <text x="50" y="622" class="box-title">caddy 单入口（内网 IP 或本地域名,自动 HTTPS）</text>
    <rect x="50" y="632" width="270" height="32" rx="6" class="card"/>
    <text x="66" y="652" class="box-sub">/api/* → app:8091</text>
    <rect x="336" y="632" width="270" height="32" rx="6" class="card"/>
    <text x="352" y="652" class="box-sub">/img/* → 本地存储缩略图</text>
    <rect x="622" y="632" width="270" height="32" rx="6" class="card"/>
    <text x="638" y="652" class="box-sub">/* → 静态前端</text>
    <rect x="908" y="632" width="284" height="32" rx="6" class="card"/>
    <text x="924" y="652" class="box-sub">无需任何外网请求</text>
  </g>

  <line x1="620" y1="674" x2="620" y2="704" class="arrow"/>

  <!-- ════ L6 呈现层 ════ -->
  <text x="30" y="698" class="layer">⑥ 呈现</text>
  <g>
    <rect x="30" y="708" width="1180" height="88" rx="10" class="card"/>
    <text x="50" y="734" class="box-title">设计团队的本地图库</text>
    <rect x="50" y="744" width="212" height="40" rx="6" class="card cardA"/>
    <text x="156" y="768" text-anchor="middle" class="step">拖图即传 · 去重报告</text>
    <rect x="278" y="744" width="212" height="40" rx="6" class="card cardA"/>
    <text x="384" y="768" text-anchor="middle" class="step">语义搜索</text>
    <rect x="506" y="744" width="212" height="40" rx="6" class="card cardA"/>
    <text x="612" y="768" text-anchor="middle" class="step">以图搜图 · 色彩检索</text>
    <rect x="734" y="744" width="212" height="40" rx="6" class="card"/>
    <text x="840" y="768" text-anchor="middle" class="step">集合 · 智能文件夹</text>
    <rect x="962" y="744" width="228" height="40" rx="6" class="card"/>
    <text x="1076" y="768" text-anchor="middle" class="step">打包下载 · 分享</text>
  </g>
</svg>
</div>

<footer>
  部署:4C8G 单机 · 无 GPU 可跑(CPU 向量 ~0.5s/张) · docker compose up -d --build 一条命令<br>
  全链路幂等:内容寻址 sha256 · ON CONFLICT · 任务队列 SKIP LOCKED · 模型权重入卷,断网可用
</footer>

</body>
</html>
